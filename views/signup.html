<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Bhargavi Housing Society</title>
<link rel="icon" href="images/branding/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base/variables.css">
<link rel="stylesheet" href="css/pages/site.css">
<link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>

<div class="auth-page">
  <div style="position:relative;z-index:1;width:100%;max-width:420px;">
    <a href="index.html" class="auth-back">&larr; Back to homepage</a>

    <div class="auth-card">
      <div class="auth-brand">
        <img src="images/branding/logo.jpg" alt="Bhargavi Housing Society logo">
        <span>
          <strong>Bhargavi Housing Society</strong>
          <span>Resident &amp; Secretary Portal</span>
        </span>
      </div>

      <h1>Create your account</h1>
      <p class="auth-sub">This links your login to your flat's member record, so you can manage your own details.</p>

      <p class="auth-error" id="signupError"></p>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="suName">Full name</label>
          <input type="text" id="suName" autocomplete="name" placeholder="As per your member record" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="suWing">Wing</label>
            <select id="suWing" required>
              <option value="" disabled selected>Select wing</option>
              <option>Wing A</option>
              <option>Wing B</option>
              <option>Wing C</option>
            </select>
          </div>
          <div class="field">
            <label for="suFlat">Flat / room no.</label>
            <input type="text" id="suFlat" placeholder="e.g. 102" required>
          </div>
        </div>
        <div class="field">
          <label for="suEmail">Email address</label>
          <input type="email" id="suEmail" autocomplete="email" placeholder="you@gmail.com" required>
          <p class="field-hint">Use this email to log in going forward — just email and password, nothing else.</p>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="suPassword">Password</label>
            <input type="password" id="suPassword" autocomplete="new-password" placeholder="At least 6 characters" required>
          </div>
          <div class="field">
            <label for="suConfirm">Confirm password</label>
            <input type="password" id="suConfirm" autocomplete="new-password" placeholder="Re-enter password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signupSubmitBtn">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<script type="module" src="js/pages/signup.js"></script>
</body>
</html>
