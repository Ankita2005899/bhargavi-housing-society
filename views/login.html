<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Bhargavi Housing Society</title>
<link rel="icon" href="images/branding/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base/variables.css">
<link rel="stylesheet" href="css/pages/site.css">
<link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>

<div class="auth-page">
  <div style="position:relative;z-index:1;width:100%;max-width:420px;">
    <a href="index.html" class="auth-back">&larr; Back to homepage</a>

    <div class="auth-card">
      <div class="auth-brand">
        <img src="images/branding/logo.jpg" alt="Bhargavi Housing Society logo">
        <span>
          <strong>Bhargavi Housing Society</strong>
          <span>Resident &amp; Secretary Portal</span>
        </span>
      </div>

      <h1>Welcome back</h1>
      <p class="auth-sub">Log in with the email and password you signed up with.</p>

      <p class="auth-error" id="loginError"></p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" autocomplete="email" placeholder="you@gmail.com" required>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Enter your password" required>
        </div>
        <div class="field-check">
          <input type="checkbox" id="loginRemember">
          <label for="loginRemember" style="margin:0;font-weight:500;">Keep me logged in on this device</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">Log in</button>
      </form>

      <p class="auth-switch">New resident? <a href="signup.html">Create an account</a></p>
    </div>

    <p class="secretary-note">Secretary account holders log in here too — the dashboard opens automatically once you're signed in.</p>
  </div>
</div>

<script type="module" src="js/pages/login.js"></script>
</body>
</html>
