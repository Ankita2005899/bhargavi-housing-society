<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Agenda — Bhargavi Housing Society</title>
<link rel="icon" href="images/branding/logo.jpg">
<style>
/* ---- base/variables.css ---- */
/* =====================================================
   DESIGN TOKENS — shared colours, type, radius, shadow
   Loaded before every other stylesheet.
   ===================================================== */
:root{
  --navy-950: #0E1B32;
  --navy-900: #142A4C;
  --navy-800: #1B3A6B;
  --navy-700: #234B85;
  --sky-500:  #4E8FC7;
  --sky-100:  #E7F0F9;
  --gold-500: #D9A441;
  --gold-600: #C08A2A;
  --diya-600: #C1522C;
  --diya-700: #A5411F;
  --paper:    #F6F5F1;
  --paper-2:  #FFFFFF;
  --ink-900:  #1B2130;
  --ink-600:  #4A5468;
  --ink-400:  #7C8598;
  --line:     #E2E1D9;

  --font-display: "Times New Roman", Times, serif;
  --font-body: "Times New Roman", Times, serif;
  --font-mono: "Times New Roman", Times, serif;

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 8px;
  --shadow-soft: 0 10px 30px rgba(14,27,50,0.08);
  --shadow-card: 0 4px 18px rgba(14,27,50,0.10);
  --ease: cubic-bezier(.22,.85,.32,1);
}


/* ---- pages/site.css ---- */
/* =====================================================
   BHARGAVI HOUSING SOCIETY — DESIGN TOKENS
   Palette: courtyard navy + marigold gold + diya orange
   Type: Sora (display) / Inter (body) / IBM Plex Mono (utility)
   Signature: the courtyard fountain — a recurring wave divider
   ===================================================== */

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink-900);
  background:var(--paper);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0 0 .4em;color:var(--navy-950);letter-spacing:-.01em;}
p{margin:0 0 1em;color:var(--ink-600);}
ul,ol{color:var(--ink-600);}
button{font-family:var(--font-body);cursor:pointer;}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ---------- utility ---------- */
.eyebrow-mono{
  font-family:var(--font-mono);
  font-size:.72rem;
  letter-spacing:.16em;
  color:var(--diya-600);
  font-weight:600;
  display:inline-block;
  margin-bottom:.6em;
}
.mini-label-mono{
  font-family:var(--font-mono);
  font-size:.68rem;
  letter-spacing:.1em;
  color:var(--ink-400);
  text-transform:uppercase;
  margin:0 0 .3em;
}
.section{padding:5.5rem 1.5rem;max-width:1240px;margin:0 auto;}
.section-head{max-width:640px;margin-bottom:2.6rem;}
.section-head h2{font-size:clamp(1.7rem,3vw,2.4rem);}
.section-sub{font-size:1.02rem;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  font-family:var(--font-body);font-weight:600;font-size:.92rem;
  padding:.85em 1.6em;border-radius:999px;border:1.5px solid transparent;
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
  white-space:nowrap;
}
.btn-primary{background:var(--diya-600);color:#fff;box-shadow:0 8px 20px rgba(193,82,44,.28);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(193,82,44,.36);background:var(--diya-700);}
.btn-ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(6px);}
.btn-ghost:hover{background:rgba(255,255,255,.22);transform:translateY(-2px);}
.btn-outline{background:transparent;border-color:var(--navy-800);color:var(--navy-800);}
.btn-outline:hover{background:var(--navy-800);color:#fff;}
.btn-sm{padding:.55em 1.1em;font-size:.8rem;}
.btn-block{width:100%;}

.tag{
  display:inline-block;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.06em;
  padding:.3em .7em;border-radius:6px;font-weight:600;text-transform:uppercase;
}
.tag.cultural{background:#FBEAD9;color:var(--diya-700);}
.tag.national{background:#E4F2E7;color:#2E6B44;}
.tag.social{background:var(--sky-100);color:var(--navy-800);}
.tag.meetings{background:#F1E9F7;color:#6C3F91;}
.tag.pending{background:#FDF0DA;color:#9A6716;margin-left:.5em;}
.tag.review{background:#E4F2E7;color:#2E6B44;margin-left:.5em;}

/* ---------- reveal-on-scroll ---------- */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease), transform .8s var(--ease);}
.reveal.in-view{opacity:1;transform:translateY(0);}

/* ---------- preloader ---------- */
#preloader{
  position:fixed;inset:0;background:var(--navy-950);z-index:9999;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .6s ease, visibility .6s ease;
}
#preloader.hide{opacity:0;visibility:hidden;}
.loader-ring{width:52px;height:52px;border-radius:50%;border:3px solid rgba(217,164,65,.25);border-top-color:var(--gold-500);animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- ticker ---------- */
.ticker-bar{background:var(--navy-950);color:var(--sky-100);overflow:hidden;padding:.5rem 0;position:relative;z-index:210;}
.ticker-track{display:flex;gap:3rem;white-space:nowrap;width:max-content;animation:ticker 28s linear infinite;font-family:var(--font-mono);font-size:.76rem;letter-spacing:.02em;padding-left:1rem;}
.ticker-track span{opacity:.92;}
@keyframes ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ---------- header ---------- */
.site-header{
  position:sticky;top:0;z-index:200;background:rgba(20,42,76,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);
  transition:background .3s ease;
}
.header-inner{max-width:1240px;margin:0 auto;padding:.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;}
.brand{display:flex;align-items:center;gap:.7rem;}
.brand-logo{width:42px;height:42px;border-radius:10px;object-fit:cover;}
.brand-text{display:flex;flex-direction:column;line-height:1.2;}
.brand-text strong{font-family:var(--font-display);color:#fff;font-size:1rem;}
.brand-text em{font-style:normal;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;color:var(--sky-100);opacity:.75;}

.main-nav{display:flex;gap:1.9rem;}
.main-nav a{color:#EDEFF3;font-size:.88rem;font-weight:500;position:relative;padding:.2rem 0;}
.main-nav a::after{content:"";position:absolute;left:0;bottom:-4px;width:0;height:2px;background:var(--gold-500);transition:width .3s var(--ease);}
.main-nav a:hover::after{width:100%;}

.hamburger{background:transparent;border:1.5px solid rgba(255,255,255,.4);border-radius:10px;width:42px;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}
.hamburger span{display:block;width:19px;height:2px;background:#fff;border-radius:2px;transition:transform .25s ease, opacity .25s ease;}

/* ---------- header auth (login / signup, or account pill) ---------- */
.header-auth{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.header-auth .account-pill{background:rgba(255,255,255,.14);color:#fff;}
.header-auth .btn-outline{border-color:rgba(255,255,255,.55);color:#fff;background:transparent;}
.header-auth .btn-outline:hover{background:rgba(255,255,255,.16);color:#fff;}
@media (max-width:560px){
  .header-auth{gap:.4rem;}
  .header-auth .btn{padding:.5em .8em;font-size:.74rem;}
}
@media (max-width:400px){
  .header-auth .btn-sm.auth-signup-btn{display:none;} /* keep just "Log in" on very small screens */
}

/* ---------- slide-in menu ---------- */
.menu-overlay{position:fixed;inset:0;background:rgba(14,27,50,.45);opacity:0;visibility:hidden;transition:opacity .3s ease, visibility .3s ease;z-index:300;}
.menu-overlay.show{opacity:1;visibility:visible;}
.slide-menu{
  position:fixed;top:0;right:0;height:100%;width:320px;max-width:88vw;background:var(--paper-2);
  z-index:301;transform:translateX(100%);transition:transform .4s var(--ease);
  box-shadow:-20px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column;padding:1.6rem;
}
.slide-menu.show{transform:translateX(0);}
.slide-menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6rem;}
.slide-menu-logo{width:38px;height:38px;border-radius:9px;}
.close-btn{background:none;border:none;font-size:1.8rem;line-height:1;color:var(--ink-600);}
.slide-menu-links{display:flex;flex-direction:column;gap:.2rem;}
.slide-menu-links a{padding:.8rem .3rem;font-weight:600;color:var(--navy-950);border-bottom:1px solid var(--line);font-size:1rem;transition:padding-left .25s ease, color .25s ease;}
.slide-menu-links a:hover{padding-left:.7rem;color:var(--diya-600);}

.view-details-trigger{
  display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;background:none;border:none;
  padding:.8rem .3rem;font-weight:600;color:var(--navy-950);border-bottom:1px solid var(--line);
  font-size:1rem;font-family:var(--font-body);cursor:pointer;transition:padding-left .25s ease, color .25s ease;
}
.view-details-trigger:hover{padding-left:.7rem;color:var(--diya-600);}
.slide-menu-divider{height:1px;background:var(--line);margin:1.4rem 0;}
.secretary-trigger{
  display:flex;align-items:center;gap:.8rem;background:var(--navy-950);color:#fff;border:none;
  padding:.9rem 1rem;border-radius:var(--radius-md);text-align:left;transition:transform .25s ease, background .25s ease;
}
.secretary-trigger:hover{transform:translateY(-2px);background:var(--navy-800);}
.secretary-trigger .lock-ic{font-size:1.3rem;}
.secretary-trigger strong{display:block;font-size:.92rem;}
.secretary-trigger small{color:var(--sky-100);opacity:.75;font-size:.72rem;}
.slide-menu-foot{margin-top:auto;font-family:var(--font-mono);font-size:.7rem;color:var(--ink-400);text-align:center;}

/* ---------- modals ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(14,27,50,.55);z-index:400;
  display:flex;align-items:center;justify-content:center;padding:1.2rem;
  opacity:0;visibility:hidden;transition:opacity .3s ease, visibility .3s ease;
}
.modal-overlay.show{opacity:1;visibility:visible;}
.modal-card{
  background:var(--paper-2);border-radius:var(--radius-lg);padding:2.2rem;max-width:420px;width:100%;
  position:relative;box-shadow:0 30px 60px rgba(0,0,0,.25);
  transform:scale(.92) translateY(10px);opacity:0;transition:transform .35s var(--ease), opacity .35s var(--ease);
  max-height:88vh;overflow-y:auto;
}
.modal-overlay.show .modal-card{transform:scale(1) translateY(0);opacity:1;}
.modal-close{position:absolute;top:1rem;right:1.1rem;background:none;border:none;font-size:1.6rem;color:var(--ink-400);line-height:1;}
.modal-icon{font-size:2rem;margin-bottom:.4rem;}
.modal-card h3{font-size:1.35rem;}
.modal-card input[type=password]{
  width:100%;padding:.85em 1em;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  font-family:var(--font-mono);letter-spacing:.3em;font-size:1rem;margin:1rem 0 .4rem;text-align:center;
}
.modal-card input[type=password]:focus{outline:none;border-color:var(--diya-600);}
.modal-error{color:#B3261E;font-size:.82rem;display:none;margin-bottom:.8rem;}
.modal-error.show{display:block;}

.secretary-panel{max-width:640px;}
.sec-panel-head{display:flex;gap:.9rem;align-items:flex-start;margin-bottom:0;}
.sec-panel-head .lock-ic{font-size:1.8rem;}
.sec-panel-head p{margin:0;}
.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.sec-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:1.1rem;}
.sec-card h4{font-size:.95rem;margin-bottom:.6rem;}
.sec-card ul{list-style:none;margin:0;padding:0;font-size:.82rem;}
.sec-card li{padding:.35rem 0;border-bottom:1px dashed var(--line);}
.sec-card li:last-child{border-bottom:none;}
.sec-mini{font-size:.82rem;margin:.2rem 0 .6rem;}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:.4rem;}
.progress-fill{height:100%;background:var(--gold-500);border-radius:99px;}
.sec-note{margin-top:1.2rem;font-size:.76rem;color:var(--ink-400);}

/* ---------- secretary full admin panel ---------- */
.secretary-panel-full{max-width:960px;width:96vw;padding:1.8rem 1.8rem 2rem;}
.sec-top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding-right:1.6rem;border-bottom:1px solid var(--line);padding-bottom:1.1rem;margin-bottom:1.1rem;}
.sec-top-actions{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.sec-top-actions .modal-close{position:static;font-size:1.5rem;}
#secGoWebsiteBtn{white-space:nowrap;}

.sec-tabs{display:flex;gap:.5rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.sec-tab{
  background:var(--paper);border:1.5px solid var(--line);color:var(--ink-600);
  font-weight:600;font-size:.86rem;padding:.55em 1.1em;border-radius:999px;
  transition:background .2s ease, color .2s ease, border-color .2s ease;
}
.sec-tab:hover{border-color:var(--gold-500);}
.sec-tab.active{background:var(--navy-950);color:#fff;border-color:var(--navy-950);}

.sec-tab-panel{display:none;}
.sec-tab-panel.active{display:block;animation:fadeInTab .3s ease;}
@keyframes fadeInTab{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.sec-summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1.1rem;}
.sec-summary-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:.8rem 1rem;}
.sec-summary-box span{display:block;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.06em;color:var(--ink-400);text-transform:uppercase;margin-bottom:.3rem;}
.sec-summary-box strong{font-family:var(--font-display);font-size:1.25rem;color:var(--navy-950);}
.sec-summary-box.income strong{color:#2E6B44;}
.sec-summary-box.expense strong{color:#B3261E;}
.sec-summary-box.balance strong{color:var(--diya-600);}

.sec-inline-form{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius-md);padding:.9rem;margin-bottom:1.1rem;}
.sec-inline-form input, .sec-inline-form select{
  flex:1 1 140px;min-width:110px;padding:.6em .8em;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  font-family:var(--font-body);font-size:.85rem;background:#fff;color:var(--ink-900);
}
.sec-inline-form input:focus, .sec-inline-form select:focus{outline:none;border-color:var(--diya-600);}
.sec-inline-form button{flex:0 0 auto;}

.sec-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-md);}
.sec-table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:560px;}
.sec-table th{text-align:left;background:var(--paper);color:var(--ink-400);font-family:var(--font-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:.7rem .8rem;border-bottom:1px solid var(--line);}
.sec-table td{padding:.65rem .8rem;border-bottom:1px solid var(--line);color:var(--ink-900);vertical-align:middle;}
.sec-table tbody tr:last-child td{border-bottom:none;}
.sec-table tbody tr:hover{background:var(--sky-100);}
.sec-row-btn{background:none;border:none;font-size:.95rem;padding:.15rem .35rem;border-radius:6px;color:var(--ink-400);}
.sec-row-btn:hover{background:var(--line);color:var(--navy-950);}
.sec-row-btn.danger:hover{background:#FBE4E1;color:#B3261E;}
.sec-empty{padding:1.4rem;text-align:center;color:var(--ink-400);font-size:.85rem;}
.tag.active{background:#E4F2E7;color:#2E6B44;}
.tag.inactive{background:#F1E1E1;color:#8A3B3B;}
.tag.due{background:#FDF0DA;color:#9A6716;}
.tag.paid{background:#E4F2E7;color:#2E6B44;}
.tag.ongoing{background:#F1E9F7;color:#6C3F91;}
.tag.planned{background:var(--sky-100);color:var(--navy-800);}
.tag.completed{background:#E4F2E7;color:#2E6B44;}

@media (max-width:640px){
  .sec-summary-row{grid-template-columns:1fr;}
  .secretary-panel-full{padding:1.4rem 1.1rem 1.6rem;}
  .edit-toolbar{flex-direction:column;align-items:stretch;text-align:center;border-radius:var(--radius-lg);padding:.9rem;}
  .edit-toolbar-actions{justify-content:center;}
}

/* ---------- live edit mode: persistent yellow highlight on editable content ---------- */
body.site-edit-mode{padding-bottom:64px;}
.site-edit-mode [data-edit-key]{
  outline:2px dashed var(--gold-500);outline-offset:3px;border-radius:4px;
  background:rgba(217,164,65,.10);transition:background .2s ease, outline-color .2s ease;
}
.site-edit-mode [data-edit-key^="text-"]{cursor:text;}
.site-edit-mode [data-edit-key]:hover{background:rgba(217,164,65,.26);outline-color:var(--diya-600);}
.site-edit-mode [data-edit-key^="text-"]:focus{outline:2px solid var(--diya-600);background:rgba(217,164,65,.18);}
.site-edit-mode [data-edit-key^="img-"]{cursor:pointer;position:relative;display:block;}
.site-edit-mode [data-edit-key^="img-"]::after{
  content:"✏️ Click to change photo";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  background:var(--navy-950);color:#fff;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.03em;
  padding:.35em .7em;border-radius:999px;opacity:0;transition:opacity .2s ease;white-space:nowrap;pointer-events:none;
}
.site-edit-mode [data-edit-key^="img-"]:hover::after{opacity:1;}

.edit-toolbar{
  position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(140%);
  z-index:500;background:var(--navy-950);color:#fff;border-radius:999px;
  display:flex;align-items:center;gap:1rem;padding:.6rem .7rem .6rem 1.3rem;
  box-shadow:0 16px 40px rgba(0,0,0,.3);border:1.5px solid var(--gold-500);
  transition:transform .35s var(--ease);max-width:92vw;flex-wrap:wrap;
}
.edit-toolbar.show{transform:translateX(-50%) translateY(0);}
.edit-toolbar-msg{font-size:.82rem;color:var(--sky-100);}
.edit-toolbar-actions{display:flex;gap:.5rem;flex-shrink:0;}

/* ---------- yellow "re-entering the website" flash ---------- */
.reentry-flash{
  position:fixed;inset:0;background:var(--gold-500);opacity:0;pointer-events:none;
  z-index:9998;transition:opacity .28s ease;
}
.reentry-flash.show{opacity:.5;}
.glow-pulse{animation:glowPulse .8s ease;position:relative;z-index:1;}
@keyframes glowPulse{
  0%{box-shadow:0 0 0 0 rgba(217,164,65,0);}
  35%{box-shadow:0 0 0 5px rgba(217,164,65,.6), 0 0 46px 12px rgba(217,164,65,.4);}
  100%{box-shadow:0 0 0 0 rgba(217,164,65,0);}
}

.meeting-popup{max-width:440px;}
.meeting-detail-row{display:flex;align-items:center;gap:.6em;font-size:.92rem;color:var(--ink-600);margin-bottom:.4em;}
.meeting-agenda{background:var(--paper);border-radius:var(--radius-md);padding:1rem 1.2rem;margin:1rem 0;}
.meeting-agenda ol{margin:0;padding-left:1.1rem;font-size:.86rem;}
.meeting-agenda li{margin-bottom:.3rem;}
.meeting-actions{display:flex;gap:.6rem;flex-wrap:wrap;}

/* ---------- hero ---------- */
.hero{position:relative;min-height:92vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden;color:#fff;}
.hero-media{position:absolute;inset:0;z-index:0;}
.hero-media img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:heroZoom 16s ease-in-out infinite alternate;}
@keyframes heroZoom{from{transform:scale(1.06);}to{transform:scale(1);}}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(14,27,50,.55) 0%, rgba(14,27,50,.72) 55%, rgba(14,27,50,.92) 100%);}
.hero-content{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:6rem 1.5rem 3rem;text-align:center;}
.hero-content h1{font-size:clamp(2.4rem,6vw,4.2rem);color:#fff;line-height:1.03;}
.hero-sub{font-size:1.08rem;color:#DDE3EE;max-width:560px;margin:1.1rem auto 1.8rem;}
.hero-cta{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
.hero-stats{
  position:relative;z-index:1;display:flex;justify-content:center;gap:clamp(1.4rem,5vw,4rem);
  padding:1.6rem 1.5rem 2.4rem;flex-wrap:wrap;
}
.hero-stats div{text-align:center;}
.hero-stats strong{display:block;font-family:var(--font-mono);font-size:1.9rem;color:var(--gold-500);}
.hero-stats span{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:#C7CEDB;}

/* ---------- fountain divider (signature) ---------- */
.fountain-divider{width:100%;overflow:hidden;line-height:0;color:var(--navy-800);background:var(--paper);}
.fountain-divider svg{width:100%;height:40px;display:block;}

  border-top:1px solid rgba(255,255,255,.08);padding:1.2rem 1.5rem;max-width:1240px;margin:0 auto;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;font-size:.76rem;color:#7C87A0;
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(20px);
  background:var(--navy-950);color:#fff;padding:.85em 1.4em;border-radius:999px;font-size:.86rem;

}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}

.scroll-top{
  position:fixed;right:1.4rem;bottom:1.6rem;width:44px;height:44px;border-radius:50%;
  background:var(--diya-600);color:#fff;border:none;font-size:1.1rem;box-shadow:0 8px 20px rgba(193,82,44,.35);

<style id="meeting-page">
/* =====================================================
   MEETING AGENDA PAGE — meeting.html
   ===================================================== */
.mt-main{max-width:1040px;}
.mt-hero{
  position:relative;overflow:hidden;border-radius:var(--radius-lg);color:#fff;
  background:radial-gradient(120% 140% at 85% 0%, rgba(217,164,65,.28) 0%, rgba(217,164,65,0) 46%),
             linear-gradient(160deg,var(--navy-800) 0%,var(--navy-950) 100%);
  box-shadow:0 22px 50px -18px rgba(14,27,50,.55);margin-bottom:1.6rem;
}
.mt-hero.has-img{min-height:300px;display:flex;align-items:flex-end;}
.mt-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9;}
.mt-hero.has-img::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(14,27,50,.15) 0%,rgba(14,27,50,.9) 82%);}
.mt-hero::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.05);right:-90px;top:-120px;z-index:1;pointer-events:none;}
.mt-hero-inner{position:relative;z-index:2;padding:2.4rem 2.6rem 2.2rem;width:100%;}
.mt-eyebrow{display:flex;align-items:center;gap:.8em;flex-wrap:wrap;margin-bottom:1rem;}

.mt-pill{
  display:inline-flex;align-items:center;gap:.5em;padding:.35em .95em;border-radius:999px;

  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);
}
.mt-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;}
.mt-pill.live{background:#C1522C;border-color:#C1522C;}
.mt-pill.live::before{animation:mtPulse 1.3s ease-in-out infinite;}
.mt-pill.soon{background:rgba(217,164,65,.9);border-color:var(--gold-500);color:var(--navy-950);}
.mt-pill.soon::before{background:var(--navy-950);}
.mt-pill.ended{background:rgba(0,0,0,.35);}
@keyframes mtPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(1.5);}}
.mt-hero h1{color:#fff;font-size:clamp(1.9rem,4.2vw,3rem);line-height:1.12;margin:0 0 .5rem;max-width:760px;}
.mt-hero-sub{color:rgba(255,255,255,.82);font-size:1.05rem;margin:0;display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;}
.mt-hero-sub span{display:inline-flex;align-items:center;gap:.5em;}
.mt-hero-sub svg{width:17px;height:17px;color:var(--gold-500);}

/* countdown */
.mt-count{display:flex;gap:.7rem;margin-top:1.7rem;flex-wrap:wrap;}
.mt-count-box{

/* info grid */

/* agenda */

.mt-panel-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.3rem;flex-wrap:wrap;}

.mt-count-chip{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3em .8em;border-radius:999px;background:var(--sky-100);color:var(--navy-800);}
.mt-agenda{list-style:none;margin:0;padding:0;counter-reset:ag;position:relative;}
.mt-agenda::before{content:"";position:absolute;left:19px;top:14px;bottom:14px;width:2px;background:linear-gradient(var(--diya-600),var(--gold-500));opacity:.35;}
.mt-agenda li{counter-increment:ag;position:relative;display:flex;gap:1.1rem;align-items:flex-start;padding:.7rem 0;color:var(--ink-900);font-size:1.04rem;line-height:1.5;}

/* actions */

/* other meetings */

.mt-others-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem;}
.mt-other{display:block;background:var(--paper-2);border:1px solid var(--line);border-left:4px solid var(--navy-800);border-radius:var(--radius-md);padding:1rem 1.1rem;transition:transform .22s var(--ease), box-shadow .22s var(--ease);}

@keyframes mtSkel{from{background-position:100% 0;}to{background-position:0 0;}}
.mt-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--navy-950);color:#fff;padding:.75em 1.4em;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:9000;}

@media (max-width:640px){
  .mt-hero-inner{padding:1.7rem 1.4rem 1.6rem;}

<script>
(function () {
'use strict';

  /* ---------- tiny helpers ---------- */
  async function apiCore(path, options = {}) {
    const res = await fetch(path, {
      method: options.method || 'GET',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
    return data;
  }

  const ICONS = {
    calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',
    video: '<rect x="3" y="6.5" width="12.5" height="11" rx="2"/><path d="m15.5 11 5-3v8l-5-3"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
    chevronLeft: '<path d="m14.5 5-7 7 7 7"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
    logout: '<path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 12H3m0 0 3.5-3.5M3 12l3.5 3.5"/>',
    download: '<path d="M12 4v11m0 0-4-4m4 4 4-4"/><path d="M5 20h14"/>',
    share: '<circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="m8.1 10.9 7.8-3.8M8.1 13.1l7.8 3.8"/>',
    print: '<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M7 14h10v6H7z"/>'
  };
  function icon(name, size) {
    const s = size || 18;
    return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.list}</svg>`;
  }
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function safeUrl(u) {
    try { const x = new URL(u, window.location.href); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
  }

  /* ---------- date / time helpers (same date handling as index.html) ---------- */
  function datePart(m) { return m.meeting_date ? String(m.meeting_date).slice(0, 10) : ''; }
  function toDate(m, time) {
    const dp = datePart(m);
    if (!dp || !time) return null;
    const d = new Date(`${dp}T${String(time).slice(0, 8).length === 5 ? String(time).slice(0, 5) + ':00' : String(time).slice(0, 8)}`);
    return isNaN(d.getTime()) ? null : d;
  }
  function fmtTime(t) {
    if (!t) return '';
    const [h, mi] = String(t).split(':');
    let hh = parseInt(h, 10); if (isNaN(hh)) return String(t);
    const ap = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12;
    return `${hh}:${(mi || '00').padStart(2, '0')} ${ap}`;
  }
  function fmtDateLong(m) {
    const dp = datePart(m); if (!dp) return '';
    const d = new Date(dp + 'T00:00:00');
    return isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  function fmtDateShort(m) {
    const dp = datePart(m); if (!dp) return '';
    const d = new Date(dp + 'T00:00:00');
    return isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function relativeDay(m) {
    const dp = datePart(m); if (!dp) return '';
    const target = new Date(dp + 'T00:00:00'); if (isNaN(target.getTime())) return '';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((target - today) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff > 1) return `In ${diff} days`;
    return '';
  }
  function durationText(m) {
    const s = toDate(m, m.start_time), e = toDate(m, m.end_time);
    if (!s || !e || e <= s) return '';
    const mins = Math.round((e - s) / 60000), h = Math.floor(mins / 60), r = mins % 60;
    return [h ? `${h} hr` : '', r ? `${r} min` : ''].filter(Boolean).join(' ');
  }
  function statusOf(m) {
    const s = toDate(m, m.start_time), e = toDate(m, m.end_time), now = new Date();
    if (e && now > e) return { cls: 'ended', text: 'Ended' };
    if (s && e && now >= s && now <= e) return { cls: 'live', text: 'Live now' };
    if (s && s - now < 24 * 3600 * 1000 && s > now) return { cls: 'soon', text: 'Starting soon' };
    return { cls: '', text: 'Upcoming' };
  }

  /* agenda text → list items (strips "1.", "-", "•" prefixes) */
  function agendaItems(text) {
    return String(text || '').split(/\r?\n/).map(l => l.replace(/^\s*(?:\d+[.)]|[-•*▪●])\s*/, '').trim()).filter(Boolean);
  }

  /* ---------- calendar / share ---------- */
  function icsStamp(d) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
  }
  function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
  function downloadIcs(m) {
    const s = toDate(m, m.start_time) || toDate(m, m.end_time);
    const e = toDate(m, m.end_time) || s;
    if (!s) return toast('Date not available for calendar');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Bhargavi Housing Society//Meeting//EN', 'BEGIN:VEVENT',
      `UID:meeting-${m.id || Date.now()}@bhargavi-housing-society`, `DTSTAMP:${icsStamp(new Date())}`,
      `DTSTART:${icsStamp(s)}`, `DTEND:${icsStamp(e)}`, `SUMMARY:${icsEsc(m.title || 'Committee meeting')}`,
      m.location ? `LOCATION:${icsEsc(m.location)}` : '', `DESCRIPTION:${icsEsc([m.description, m.meeting_link ? 'Join: ' + m.meeting_link : ''].filter(Boolean).join('\n\n'))}`,
      'END:VEVENT', 'END:VCALENDAR'].filter(Boolean);
    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'society-meeting.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Calendar file downloaded');
  }
  function shareText(m) {
    const t = [fmtTime(m.start_time), fmtTime(m.end_time)].filter(Boolean).join(' – ');
    return [`📅 ${m.title || 'Committee meeting'} — Bhargavi Housing Society`, fmtDateLong(m), t && `🕒 ${t}`, m.location && `📍 ${m.location}`,
      m.meeting_link && `🔗 ${m.meeting_link}`].filter(Boolean).join('\n');
  }
  async function shareMeeting(m) {
    const text = shareText(m);
    try {
      if (navigator.share) { await navigator.share({ title: m.title || 'Meeting', text }); return; }
      await navigator.clipboard.writeText(text); toast('Meeting details copied');
    } catch (e) { /* user cancelled */ }
  }
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('mtToast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ---------- gate (same rule as notice.html) ---------- */
  async function gateAndInitHeader() {
    let session;
    try { session = await apiCore('/api/auth/session'); } catch (e) { session = { loggedIn: false }; }
    if (!session.loggedIn) {
      window.location.replace(`login.html?next=${encodeURIComponent(window.location.pathname + window.location.search)}`);
      return null;
    }
    document.body.classList.remove('site-gate-pending');
    const slot = document.getElementById('headerAuthSlot');
    if (slot) {
      const label = session.role === 'secretary' ? 'Secretary' : 'Resident';
      slot.innerHTML = `<span class="account-pill">${icon('user', 15)} ${label}</span>
        <button class="btn btn-outline btn-sm" id="logoutBtn">${icon('logout', 14)} Log out</button>`;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await apiCore('/api/auth/logout', { method: 'POST' });
        window.location.href = 'login.html';
      });
    }
    document.getElementById('year').textContent = new Date().getFullYear();
    return session;
  }

  /* ---------- render ---------- */
  const main = document.getElementById('detailMain');
  let meetings = [], currentId = null, tick = null;

  function pickCurrent() {
    const wanted = new URLSearchParams(window.location.search).get('id');
    return meetings.find(m => String(m.id) === String(wanted)) || meetings[0];
  }

  function emptyState(msg, sub) {
    main.innerHTML = `
      <a class="detail-back" href="index.html#dashboard">${icon('chevronLeft', 16)} Back to Dashboard</a>
      <div class="mt-state">
        <div class="big">🗓️</div>
        <h1>${msg}</h1>
        <p>${sub}</p>
        <a class="btn btn-primary" href="index.html#dashboard">Back to Dashboard</a>
      </div>`;
  }

  function countdownHtml(m) {
    const s = toDate(m, m.start_time), e = toDate(m, m.end_time), now = new Date();
    if (e && now > e) return `<div class="mt-count-msg">This meeting has ended.</div>`;
    if (s && e && now >= s && now <= e) return `<div class="mt-count-msg">● The meeting is in progress — you can join now.</div>`;
    if (!s) return '';
    let diff = Math.max(0, Math.floor((s - now) / 1000));
    const d = Math.floor(diff / 86400); diff -= d * 86400;
    const h = Math.floor(diff / 3600); diff -= h * 3600;
    const mi = Math.floor(diff / 60), sec = diff - mi * 60;
    const box = (n, l) => `<div class="mt-count-box"><strong>${String(n).padStart(2, '0')}</strong><span>${l}</span></div>`;
    return `<div class="mt-count" aria-label="Time until meeting starts">${box(d, 'Days')}${box(h, 'Hours')}${box(mi, 'Minutes')}${box(sec, 'Seconds')}</div>`;
  }

  function render() {
    if (!meetings.length) {
      emptyState('No meeting scheduled', 'The Secretary hasn\'t scheduled any upcoming meeting yet. Check back closer to the AGM — new meetings appear here the moment they are added.');
      return;
    }
    const m = pickCurrent(); currentId = m.id;
    const st = statusOf(m);
    const dateLong = fmtDateLong(m), rel = relativeDay(m);
    const timeTxt = [fmtTime(m.start_time), fmtTime(m.end_time)].filter(Boolean).join(' – ');
    const dur = durationText(m);
    const link = m.meeting_link ? safeUrl(m.meeting_link) : '';
    const items = agendaItems(m.description);
    const others = meetings.filter(x => x !== m);
    const img = m.image && /^(data:image\/|https?:|\/|images\/)/.test(m.image) ? m.image : '';

    main.innerHTML = `
      <a class="detail-back" href="index.html#dashboard">${icon('chevronLeft', 16)} Back to Dashboard</a>
      <div class="detail-breadcrumb">
        <a href="index.html">Home</a> <span>/</span> <a href="index.html#dashboard">Dashboard</a> <span>/</span> <span>Meeting agenda</span>
      </div>

      <section class="mt-hero ${img ? 'has-img' : ''}">
        ${img ? `<img class="mt-hero-img" src="${escapeHtml(img)}" alt="">` : ''}
        <div class="mt-hero-inner">
          <div class="mt-eyebrow">
            <span class="eyebrow-mono">SCHEDULED MEETING</span>
            <span class="mt-pill ${st.cls}" id="mtPill">${st.text}</span>
          </div>
          <h1>${escapeHtml(m.title || 'Committee meeting')}</h1>
          <p class="mt-hero-sub">
            ${dateLong ? `<span>${icon('calendar', 17)} ${escapeHtml(dateLong)}${rel ? ' · ' + rel : ''}</span>` : ''}
            ${timeTxt ? `<span>${icon('clock', 17)} ${escapeHtml(timeTxt)}</span>` : ''}
          </p>
          <div id="mtCountdown">${countdownHtml(m)}</div>
        </div>
      </section>

      <section class="mt-info">
        ${dateLong ? `<div class="mt-info-card date"><span class="mt-info-ic">${icon('calendar', 21)}</span><div><p class="mini-label-mono">Date</p><p class="v">${escapeHtml(fmtDateShort(m))}</p><p class="s">${escapeHtml(dateLong.split(',').slice(-1)[0].trim())}</p></div></div>` : ''}
        ${timeTxt ? `<div class="mt-info-card time"><span class="mt-info-ic">${icon('clock', 21)}</span><div><p class="mini-label-mono">Time</p><p class="v">${escapeHtml(timeTxt)}</p>${dur ? `<p class="s">Duration · ${escapeHtml(dur)}</p>` : ''}</div></div>` : ''}
        ${m.location ? `<div class="mt-info-card place"><span class="mt-info-ic">${icon('pin', 21)}</span><div><p class="mini-label-mono">Venue</p><p class="v">${escapeHtml(m.location)}</p></div></div>` : ''}
        ${link ? `<div class="mt-info-card link"><span class="mt-info-ic">${icon('video', 21)}</span><div><p class="mini-label-mono">Online</p><p class="v">Join via link</p><p class="s">Google Meet / Zoom</p></div></div>` : ''}
      </section>

      <section class="mt-panel">
        <div class="mt-panel-head">
          <h2>${icon('list', 22)} Agenda</h2>
          ${items.length > 1 ? `<span class="mt-count-chip">${items.length} points</span>` : ''}
        </div>
        ${items.length > 1
          ? `<ol class="mt-agenda">${items.map(i => `<li><span>${escapeHtml(i)}</span></li>`).join('')}</ol>`
          : items.length === 1
            ? `<p class="mt-agenda-text">${escapeHtml(items[0])}</p>`
            : `<p class="mt-agenda-empty">The Secretary hasn't added a detailed agenda for this meeting yet.</p>`}
      </section>

      <div class="mt-actions">
        ${link ? `<a class="btn btn-join" href="${escapeHtml(link)}" target="_blank" rel="noopener">${icon('video', 17)} Join meeting</a>` : ''}
        <button class="btn btn-outline" id="mtCal">${icon('download', 17)} Add to calendar</button>
        <button class="btn btn-outline" id="mtShare">${icon('share', 17)} Share</button>
        <button class="btn btn-outline" id="mtPrint">${icon('print', 17)} Print</button>
      </div>

      ${others.length ? `
      <section class="mt-others">
        <h3>Other scheduled meetings</h3>
        <div class="mt-others-grid">
          ${others.map(o => `
            <a class="mt-other" href="meeting.html?id=${encodeURIComponent(o.id)}">
              <h4>${escapeHtml(o.title || 'Committee meeting')}</h4>
              <p>${escapeHtml([fmtDateShort(o), fmtTime(o.start_time)].filter(Boolean).join(' · '))}${o.location ? ' · ' + escapeHtml(o.location) : ''}</p>
            </a>`).join('')}
        </div>
      </section>` : ''}
    `;

    document.title = `${m.title || 'Meeting'} — Bhargavi Housing Society`;
    document.getElementById('mtCal').addEventListener('click', () => downloadIcs(m));
    document.getElementById('mtShare').addEventListener('click', () => shareMeeting(m));
    document.getElementById('mtPrint').addEventListener('click', () => window.print());

    clearInterval(tick);
    tick = setInterval(() => {
      const cd = document.getElementById('mtCountdown'), pill = document.getElementById('mtPill');
      if (!cd) return;
      cd.innerHTML = countdownHtml(m);
      const s2 = statusOf(m); pill.className = 'mt-pill ' + s2.cls; pill.textContent = s2.text;
    }, 1000);
  }

  async function load(first) {
    try {
      meetings = await apiCore('/api/public/meetings/active');
      if (!Array.isArray(meetings)) meetings = [];
      if (first || String((pickCurrent() || {}).id) !== String(currentId)) render();
      else if (!meetings.length) render();
    } catch (err) {
      if (first) emptyState('Couldn\'t load the meeting', 'Please check your connection and try again in a moment.');
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const session = await gateAndInitHeader();
    if (!session) return;
    await load(true);
    setInterval(() => load(false), 60000);   // pick up new / edited / ended meetings
  });

})();
</script>

<script id="brand-click-anim">
(function(){
  var b=document.querySelector('.site-header .brand'); if(!b) return;
  b.addEventListener('click',function(e){
    b.classList.remove('brand-clicked'); void b.offsetWidth; b.classList.add('brand-clicked');
    if(e.ctrlKey||e.metaKey||e.shiftKey||e.button===1) return;
    var href=b.getAttribute('href')||'';
    if(href && href.charAt(0)!=='#'){ e.preventDefault(); setTimeout(function(){location.href=href;},420); }
    setTimeout(function(){b.classList.remove('brand-clicked');},520);
  });
})();
</script>
<script src="logout-confirm.js"></script>
<script src="click-sounds.js"></script>
<script src="responsive-nav.js"></script>
</body>
</html>
